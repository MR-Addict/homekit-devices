<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#f5f6f0">
    <title>HomeKit 设备 BLE 配网</title>
    <link rel="icon" type="image/svg+xml" href="./logo.svg">
    <script type="module" src="./src/app.ts"></script>
  </head>
  <body>
    <main class="shell">
      <header class="intro">
        <div class="brand">
          <img class="brand-logo" src="./logo.svg" alt="" width="40" height="40">
          <span>HOME DEVICES</span>
        </div>
        <div class="hero">
          <p class="eyebrow">无线设置 / WIRELESS SETUP</p>
          <h1>让设备<br><span>连上网络。</span></h1>
          <p class="lead">靠近设备，打开蓝牙。<br>几步就能更新它的 Wi‑Fi 信息。</p>
        </div>
        <p class="intro-note"><span aria-hidden="true"></span> 仅在浏览器与附近设备之间通信</p>
      </header>

      <div class="workspace">
        <div class="setup-surface">
          <section class="device-section" aria-labelledby="device-heading">
            <div class="section-header">
              <h2 id="device-heading">选择设备</h2>
              <span class="section-hint">BLE</span>
            </div>
            <div class="device-row">
              <div class="device-icon" aria-hidden="true">
                <svg viewBox="0 0 32 32" fill="none"><path d="m12 9 9 9-5 5V5l5 5-9 9" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
              </div>
              <div class="device-details">
                <div id="device-name" class="device-name">尚未选择设备</div>
                <div id="device-state" class="device-state">请先开启蓝牙</div>
              </div>
            </div>
            <div class="device-actions">
              <button id="connect-button" class="button primary" type="button">搜索设备 <span aria-hidden="true">↗</span></button>
              <button id="disconnect-button" class="button quiet" type="button" hidden>断开蓝牙</button>
            </div>
          </section>

          <section id="auth-section" class="form-section" aria-labelledby="auth-heading" hidden>
            <div class="section-header">
              <h2 id="auth-heading">验证 OTA 密码</h2>
            </div>
            <form id="auth-form" autocomplete="off">
              <label for="ota-password">OTA 密码</label>
              <input id="ota-password" type="password" required autocomplete="off" placeholder="输入设备的 OTA 密码">
              <button id="auth-button" class="button primary" type="submit">验证并继续 <span aria-hidden="true">↗</span></button>
            </form>
          </section>

          <section id="wifi-section" class="form-section" aria-labelledby="wifi-heading" hidden>
            <div class="section-header">
              <h2 id="wifi-heading">Wi‑Fi 信息</h2>
            </div>
            <form id="provision-form" autocomplete="off">
              <label for="ssid">网络名称</label>
              <input id="ssid" type="text" required autocomplete="off" spellcheck="false" placeholder="2.4 GHz Wi‑Fi 名称">
              <label for="wifi-password">网络密码</label>
              <input id="wifi-password" type="text" autocomplete="off" spellcheck="false" placeholder="开放网络可留空">
              <button id="submit-button" class="button primary" type="submit">保存 Wi‑Fi 信息 <span aria-hidden="true">↗</span></button>
            </form>
          </section>
        </div>

        <div id="status" class="status" role="status" aria-live="polite" hidden></div>
        <footer>OTA 密码验证成功后保存在此浏览器。Wi‑Fi 信息不会保存或上传。</footer>
      </div>
    </main>
  </body>
</html>
