homekit:
  name: "Router Temperature"
  storage_path: "/etc/homekit-temperature/db"
  listen_address: ":32043"
  interfaces: ["br-lan"]
temperature:
  name: "Router Temperature"
  # 在目标设备运行 homekit-temperature -list-sensors，按 type 确认实际路径。
  path: "/sys/class/thermal/thermal_zone0/temp"
  interval: "30s"
